name: ci

on:
  push:
  pull_request:

jobs:
  # Engine + regression guards on Linux AND macOS, across supported Node lines. smoke.sh does NOT
  # start Chrome; the e2e job below does.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24', '26']
        include:
          - os: macos-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: smoke + engine tests (no Chrome)
        working-directory: plugins/tandem
        run: bash tests/smoke.sh
      - name: MCP handshake through the node launcher
        working-directory: plugins/tandem
        run: node tests/mcp-handshake.mjs

  # Windows NATIVE (real teammates run tandem there): the node launcher's MCP handshake (no Chrome
  # needed — the MCP connects lazily) + the platform-independent engine tests. The bash lifecycle
  # (lib.sh) is not exercised here: under Windows it runs in Git Bash and stays best effort.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: engine tests (node)
        working-directory: plugins/tandem
        shell: bash
        # Job logs need auth to download; annotations are public: each failing suite ships its ✗ lines
        # and output tail as one.
        run: |
          rc=0
          for t in host selector page-signals recipe har profile review lifecycle; do
            if ! out="$(node "tests/$t.test.mjs" 2>&1)"; then
              rc=1; printf '%s\n' "$out"
              echo "::error title=windows $t.test.mjs::$( { printf '%s\n' "$out" | grep '✗' ; printf '%s\n' "$out" | tail -n 25; } | tr -d '\r' | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"
            fi
          done
          exit $rc
      - name: MCP handshake through the node launcher (initialize + tools/list)
        working-directory: plugins/tandem
        run: node tests/mcp-handshake.mjs

  # Real Chrome, headless: daemon start/ownership/stop, HAR recorder + intercept daemon over several
  # tabs, cookies, pdf/png. --no-sandbox: ubuntu runners restrict unprivileged user namespaces.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: e2e with headless Chrome
        working-directory: plugins/tandem
        env:
          TANDEM_CHROME_ARGS: --headless=new --no-sandbox
        run: bash tests/e2e.sh

  # Shell lint on Linux (shellcheck ships on ubuntu runners; install as a fallback).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        working-directory: plugins/tandem
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck -x -S style scripts/*.sh bin/* tests/*.sh install.sh adapters/*/scripts/*.sh adapters/shared/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: adapters parse
        working-directory: plugins/tandem
        run: |
          node --check adapters/cursor/hooks/inject-profile.mjs
          node --check adapters/opencode/merge-opencode-fragment.mjs
          node -e 'JSON.parse(require("fs").readFileSync("adapters/cursor/hooks/hooks.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("adapters/opencode/opencode.fragment.jsonc","utf8").replace(/^\s*\/\/.*$/gm,""))'
      - name: bench harness parses
        run: for f in bench/webarena/*.mjs; do node --check "$f"; done
