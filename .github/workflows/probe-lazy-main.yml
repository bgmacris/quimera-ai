name: probe-lazy-main
on:
  push:
    branches: ['probe/**']
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: lazy
        run: xvfb-run -a bash probe/lazy.sh 2>/dev/null
        env: { TANDEM_CHROME_ARGS: --no-sandbox }
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: lazy
        shell: bash
        run: bash probe/lazy.sh
